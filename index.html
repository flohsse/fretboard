<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gitarren Noten">

<title>Gitarren Noten Trainer</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #0d0d0f;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  min-height: 100vh;
  overflow: hidden;
}

button,
select {
  font: inherit;
}

.app {
  width: 100%;
  height: 100vh;

  padding:
    max(4px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(4px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
}


/* -------------------------
   PORTRAIT
-------------------------- */

.orientation-warning {
  display: none;

  text-align: center;
  padding: 50px 20px;

  font-size: 22px;
}


/* -------------------------
   START
-------------------------- */

.setup,
.result {

  max-width: 500px;

  margin: 20px auto;

  padding: 18px;

  border-radius: 18px;

  background: #1b1b1e;
}

.setup h1,
.result h2 {
  margin-top: 0;
  text-align: center;
}

.setup label {
  display: block;
  margin-bottom: 7px;
  font-weight: 700;
}

select {

  width: 100%;

  padding: 11px;

  margin-bottom: 14px;

  border: none;
  border-radius: 11px;

  background: white;
  color: black;
}

.primary,
.secondary {

  width: 100%;

  border: none;
  border-radius: 12px;

  padding: 13px;

  font-weight: 800;
}

.primary {
  background: #36cf70;
  color: #07140b;
}

.secondary {
  margin-top: 8px;

  background: #323237;
  color: white;
}


/* -------------------------
   SPIEL
-------------------------- */

.game {
  display: none;
}


/* STATUS */

.topbar {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 6px;

  margin-bottom: 5px;
}

.stat {

  background: #202024;

  border-radius: 10px;

  text-align: center;

  padding: 4px 3px;

  font-size: 13px;

  font-weight: 700;
}

.stat span {
  font-size: 15px;
}


/* -------------------------
   GRIFFBRETT
-------------------------- */

.board-section {

  width: 100%;

  margin-bottom: 4px;
}

.fretboard {

  position: relative;

  width: 100%;

  /*
    bewusst niedriger,
    damit alles aufs Display passt
  */

  height: 210px;

  overflow: hidden;

  border-radius:
    11px 11px 8px 8px;

  border:
    3px solid #251208;

  background:

    repeating-linear-gradient(
      0deg,
      rgba(40, 12, 3, .28) 0,
      rgba(40, 12, 3, .28) 3px,
      rgba(110, 48, 18, .18) 4px,
      rgba(70, 25, 8, .26) 7px
    ),

    linear-gradient(
      90deg,
      #733719,
      #4d210f
    );

  box-shadow:
    0 5px 16px rgba(0,0,0,.5);
}


/*
leichte optische Verschmälerung
auf der Seite der hohen E-Saite
*/

.fretboard::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 12px;

  background:
    linear-gradient(
      180deg,
      rgba(13,13,15,.38),
      transparent
    );

  z-index: 20;

  pointer-events: none;
}


/* SATTEL */

.nut {

  position: absolute;

  left: 0;
  top: 0;
  bottom: 0;

  width: 7px;

  background:
    linear-gradient(
      90deg,
      #c9bfa8,
      #fff8e9,
      #bcb29c
    );

  z-index: 10;
}


/* BÜNDE */

.fret {

  position: absolute;

  top: 0;
  bottom: 0;

  width: 2px;

  background:
    linear-gradient(
      90deg,
      #777,
      #eeeeee,
      #777
    );

  z-index: 5;
}


/* SAITEN */

.string {

  position: absolute;

  left: 0;
  right: 0;

  transform:
    translateY(-50%);

  background:
    linear-gradient(
      180deg,
      #555,
      #eee,
      #666
    );

  box-shadow:
    0 1px 1px rgba(0,0,0,.8);

  z-index: 7;
}

.s1 { height: 1px; }
.s2 { height: 1.3px; }
.s3 { height: 1.7px; }
.s4 { height: 2.1px; }
.s5 { height: 2.7px; }
.s6 { height: 3.2px; }


/* -------------------------
   LES PAUL INLAYS
-------------------------- */

.inlay {

  position: absolute;

  width: 24px;
  height: 34px;

  transform:
    translate(-50%, -50%);

  /*
    Les-Paul-artige
    trapezförmige Einlage
  */

  clip-path:
    polygon(
      18% 0,
      82% 0,
      70% 100%,
      30% 100%
    );

  background:

    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(215,207,180,.85),
      rgba(255,255,255,.95)
    );

  box-shadow:
    inset 0 0 4px rgba(255,255,255,.8);

  opacity: .88;

  z-index: 3;
}


/*
12. Bund etwas größer
*/

.inlay.twelve {

  width: 30px;
  height: 46px;
}


/* -------------------------
   ZIELPUNKT
-------------------------- */

.target {

  position: absolute;

  width: 29px;
  height: 29px;

  border-radius: 50%;

  background: #ff4141;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px rgba(255,65,65,.25),
    0 3px 8px rgba(0,0,0,.55);

  transform:
    translate(-50%, -50%);

  z-index: 15;
}


/* -------------------------
   BUNDNUMMERN
-------------------------- */

.fret-labels {

  position: relative;

  width: 100%;
  height: 18px;

  margin-top: 0;
}

.fret-label {

  position: absolute;

  top: 1px;

  transform:
    translateX(-50%);

  color: #c8c8cc;

  font-size: 10px;

  font-weight: 700;
}


/* -------------------------
   NOTEN BUTTONS
-------------------------- */

.notes {

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 6px;
}

.note-btn {

  height: 43px;

  border: none;

  border-radius: 10px;

  background: #2b2b30;

  color: white;

  font-size: 18px;

  font-weight: 800;
}

.note-btn:active {
  transform: scale(.97);
}

.note-btn.correct {

  background:
    #23b85d !important;
}

.note-btn.wrong {

  background:
    #dc3c3c !important;
}


/* -------------------------
   ERGEBNIS
-------------------------- */

.result {
  display: none;
}

.result-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin: 16px 0;
}

.result-box {

  padding: 10px;

  text-align: center;

  background: #29292d;

  border-radius: 11px;
}

.result-value {

  margin-top: 4px;

  font-size: 23px;

  font-weight: 800;
}

.best {

  margin-bottom: 14px;

  text-align: center;

  font-weight: 700;
}


/* -------------------------
   PORTRAIT
-------------------------- */

@media (orientation: portrait) {

  .orientation-warning {
    display: block;
  }

  .main-content {
    display: none;
  }
}


/* -------------------------
   KLEINE IPHONES
-------------------------- */

@media
(orientation: landscape)
and
(max-height: 430px) {

  .app {

    padding-top: 2px;
    padding-bottom: 2px;
  }

  .fretboard {

    /*
      nochmals flacher
      bei kleinen Displays
    */

    height: 180px;
  }

  .topbar {
    gap: 4px;
    margin-bottom: 3px;
  }

  .stat {

    padding: 2px;

    font-size: 11px;
  }

  .stat span {
    font-size: 13px;
  }

  .fret-labels {
    height: 16px;
  }

  .fret-label {
    font-size: 9px;
  }

  .note-btn {

    height: 38px;

    font-size: 16px;
  }

  .inlay {

    width: 20px;
    height: 29px;
  }

  .inlay.twelve {

    width: 25px;
    height: 38px;
  }

  .target {

    width: 26px;
    height: 26px;
  }
}

</style>
</head>

<body>

<div class="app">

<div class="orientation-warning">

  🎸 Bitte das iPhone ins Querformat drehen.

</div>


<div class="main-content">


<!-- START -->

<div
  id="setup"
  class="setup"
>

<h1>
🎸 Gitarren Noten Trainer
</h1>

<label for="questionCount">
Anzahl der Noten
</label>

<select id="questionCount">

<option value="10">
10 Noten
</option>

<option
  value="20"
  selected
>
20 Noten
</option>

<option value="30">
30 Noten
</option>

<option value="50">
50 Noten
</option>

<option value="100">
100 Noten
</option>

</select>

<button
  id="startButton"
  class="primary"
>
Training starten
</button>

</div>



<!-- SPIEL -->

<div
  id="game"
  class="game"
>


<div class="topbar">

<div class="stat">

Note<br>

<span id="progress">
1 / 20
</span>

</div>


<div class="stat">

⏱ Zeit<br>

<span id="timer">
00:00.0
</span>

</div>


<div class="stat">

✓ Richtig<br>

<span id="correctCount">
0
</span>

</div>


<div class="stat">

✕ Fehler<br>

<span id="wrongCount">
0
</span>

</div>

</div>



<div class="board-section">


<div
  id="fretboard"
  class="fretboard"
>

<div class="nut"></div>

<div id="frets"></div>

<div id="inlays"></div>

<div id="strings"></div>

<div
  id="target"
  class="target"
></div>

</div>


<div
  id="fretLabels"
  class="fret-labels"
></div>

</div>



<div
  id="noteButtons"
  class="notes"
></div>


</div>



<!-- RESULT -->

<div
  id="result"
  class="result"
>

<h2>
Training beendet 🎸
</h2>


<div class="result-grid">


<div class="result-box">

Gesamtzeit

<div
  id="resultTime"
  class="result-value"
></div>

</div>


<div class="result-box">

Fehler

<div
  id="resultErrors"
  class="result-value"
></div>

</div>


<div class="result-box">

Noten

<div
  id="resultCorrect"
  class="result-value"
></div>

</div>


<div class="result-box">

Ø pro Note

<div
  id="resultAverage"
  class="result-value"
></div>

</div>


</div>


<div
  id="bestTime"
  class="best"
></div>


<button
  id="againButton"
  class="primary"
>
Nochmal
</button>


<button
  id="menuButton"
  class="secondary"
>
Anzahl ändern
</button>


</div>


</div>
</div>



<script>


/* -------------------------
   NOTEN
-------------------------- */

const notes = [

  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"

];


/*
Standardstimmung

hohe E
B
G
D
A
tiefe E
*/

const openStrings = [

  4,
  11,
  7,
  2,
  9,
  4

];


/* -------------------------
   ELEMENTE
-------------------------- */

const setup =
  document.getElementById(
    "setup"
  );

const game =
  document.getElementById(
    "game"
  );

const result =
  document.getElementById(
    "result"
  );

const frets =
  document.getElementById(
    "frets"
  );

const strings =
  document.getElementById(
    "strings"
  );

const inlays =
  document.getElementById(
    "inlays"
  );

const fretLabels =
  document.getElementById(
    "fretLabels"
  );

const target =
  document.getElementById(
    "target"
  );

const noteButtons =
  document.getElementById(
    "noteButtons"
  );

const progress =
  document.getElementById(
    "progress"
  );

const timerDisplay =
  document.getElementById(
    "timer"
  );

const correctDisplay =
  document.getElementById(
    "correctCount"
  );

const wrongDisplay =
  document.getElementById(
    "wrongCount"
  );


/* -------------------------
   SPIELVARIABLEN
-------------------------- */

let totalQuestions = 20;

let completedQuestions = 0;

let errors = 0;

let currentString = 0;

let currentFret = 0;

let correctNote = "";

let previousString = -1;

let previousFret = -1;

let startTime = 0;

let finalTime = 0;

let timerInterval = null;

let inputLocked = false;



/* -------------------------
   BUNDPOSITIONEN
-------------------------- */

const fretPositions = [];


function calculateFretPositions() {

  fretPositions.length = 0;

  const maxFret = 22;


  const rawMax =

    1 -

    Math.pow(
      2,
      -maxFret / 12
    );


  fretPositions.push(0);


  for (
    let fret = 1;
    fret <= maxFret;
    fret++
  ) {

    const raw =

      1 -

      Math.pow(
        2,
        -fret / 12
      );


    const scaled =

      raw / rawMax;


    fretPositions.push(

      scaled * 100

    );

  }

}



function getFretCenter(fret) {

  const left =

    fret === 1

    ? 0

    : fretPositions[
        fret - 1
      ];


  const right =
    fretPositions[fret];


  return (
    left + right
  ) / 2;

}



/* -------------------------
   SAITENHÖHE
-------------------------- */

function getStringY(
  stringIndex
) {

  /*
    oben/unten weniger Rand
    → Griffbrett wirkt flacher
  */

  return (

    8

    +

    stringIndex * 16.8

  );

}



/* -------------------------
   GRIFFBRETT BAUEN
-------------------------- */

function buildFretboard() {

  frets.innerHTML = "";

  strings.innerHTML = "";

  inlays.innerHTML = "";

  fretLabels.innerHTML = "";


  /* BÜNDE */

  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const line =
      document.createElement(
        "div"
      );


    line.className =
      "fret";


    line.style.left =

      fretPositions[fret]

      +

      "%";


    frets.appendChild(
      line
    );


    /* BUNDNUMMER */

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "fret-label";


    label.textContent =
      fret;


    label.style.left =

      getFretCenter(fret)

      +

      "%";


    fretLabels.appendChild(
      label
    );

  }



  /* SAITEN */

  for (
    let string = 0;
    string < 6;
    string++
  ) {

    const line =
      document.createElement(
        "div"
      );


    line.className =

      "string s"

      +

      (string + 1);


    line.style.top =

      getStringY(string)

      +

      "%";


    strings.appendChild(
      line
    );

  }



  /* LES-PAUL-INLAYS */

  const inlayFrets = [

    3,
    5,
    7,
    9,
    12,
    15,
    17,
    19,
    21

  ];


  inlayFrets.forEach(

    fret => {

      createInlay(fret);

    }

  );

}



/* -------------------------
   TRAPEZ-INLAY
-------------------------- */

function createInlay(fret) {

  const inlay =
    document.createElement(
      "div"
    );


  inlay.className =
    "inlay";


  if (fret === 12) {

    inlay.classList.add(
      "twelve"
    );

  }


  inlay.style.left =

    getFretCenter(fret)

    +

    "%";


  /*
    Mittig zwischen
    D- und G-Saite
  */

  inlay.style.top =
    "50%";


  inlays.appendChild(
    inlay
  );

}



/* -------------------------
   BUTTONS
-------------------------- */

function buildNoteButtons() {

  noteButtons.innerHTML =
    "";


  notes.forEach(

    note => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "note-btn";


      button.dataset.note =
        note;


      button.textContent =
        note;


      button.addEventListener(

        "click",

        () => answer(
          note,
          button
        )

      );


      noteButtons.appendChild(
        button
      );

    }

  );

}



/* -------------------------
   FEEDBACK LÖSCHEN
-------------------------- */

function clearButtonFeedback() {

  document
    .querySelectorAll(
      ".note-btn"
    )
    .forEach(

      button => {

        button.classList.remove(

          "correct",
          "wrong"

        );

      }

    );

}



/* -------------------------
   START
-------------------------- */

function startGame() {

  totalQuestions =

    Number(

      document
        .getElementById(
          "questionCount"
        )
        .value

    );


  completedQuestions = 0;

  errors = 0;


  previousString = -1;

  previousFret = -1;


  inputLocked = false;


  correctDisplay.textContent =
    "0";

  wrongDisplay.textContent =
    "0";


  clearButtonFeedback();


  setup.style.display =
    "none";

  result.style.display =
    "none";

  game.style.display =
    "block";


  startTime =
    performance.now();


  clearInterval(
    timerInterval
  );


  timerInterval =
    setInterval(

      updateTimer,

      50

    );


  nextQuestion();

}



/* -------------------------
   NÄCHSTE NOTE
-------------------------- */

function nextQuestion() {

  clearButtonFeedback();


  inputLocked =
    false;


  progress.textContent =

    (
      completedQuestions
      +
      1
    )

    +

    " / "

    +

    totalQuestions;


  let newString;

  let newFret;


  do {

    newString =

      Math.floor(
        Math.random() * 6
      );


    newFret =

      Math.floor(
        Math.random() * 22
      )

      +

      1;

  }

  while (

    newString
      ===
      previousString

    &&

    newFret
      ===
      previousFret

  );


  currentString =
    newString;

  currentFret =
    newFret;


  previousString =
    newString;

  previousFret =
    newFret;


  const noteIndex =

    (
      openStrings[
        currentString
      ]

      +

      currentFret
    )

    %

    12;


  correctNote =
    notes[
      noteIndex
    ];


  positionTarget();

}



/* -------------------------
   ZIELPOSITION
-------------------------- */

function positionTarget() {

  target.style.left =

    getFretCenter(
      currentFret
    )

    +

    "%";


  target.style.top =

    getStringY(
      currentString
    )

    +

    "%";

}



/* -------------------------
   ANTWORT
-------------------------- */

function answer(
  selectedNote,
  selectedButton
) {

  if (inputLocked) {
    return;
  }


  /* RICHTIG */

  if (
    selectedNote
      ===
      correctNote
  ) {

    inputLocked =
      true;


    selectedButton
      .classList
      .add(
        "correct"
      );


    completedQuestions++;


    correctDisplay.textContent =
      completedQuestions;


    setTimeout(

      () => {

        if (

          completedQuestions
            >=
            totalQuestions

        ) {

          endGame();

        }

        else {

          nextQuestion();

        }

      },

      180

    );

  }


  /* FALSCH */

  else {

    inputLocked =
      true;


    errors++;


    wrongDisplay.textContent =
      errors;


    selectedButton
      .classList
      .add(
        "wrong"
      );


    const correctButton =

      document
        .querySelector(

          `.note-btn[data-note="${correctNote}"]`

        );


    if (correctButton) {

      correctButton
        .classList
        .add(
          "correct"
        );

    }


    setTimeout(

      () => {

        clearButtonFeedback();

        inputLocked =
          false;

      },

      400

    );

  }

}



/* -------------------------
   TIMER
-------------------------- */

function updateTimer() {

  const elapsed =

    performance.now()

    -

    startTime;


  timerDisplay.textContent =

    formatTime(
      elapsed
    );

}



function formatTime(
  milliseconds
) {

  const totalSeconds =

    milliseconds
    /
    1000;


  const minutes =

    Math.floor(
      totalSeconds / 60
    );


  const seconds =

    Math.floor(
      totalSeconds % 60
    );


  const tenths =

    Math.floor(

      (
        totalSeconds % 1
      )

      *

      10

    );


  return (

    String(minutes)
      .padStart(
        2,
        "0"
      )

    +

    ":"

    +

    String(seconds)
      .padStart(
        2,
        "0"
      )

    +

    "."

    +

    tenths

  );

}



/* -------------------------
   ENDE
-------------------------- */

function endGame() {

  clearInterval(
    timerInterval
  );


  finalTime =

    performance.now()

    -

    startTime;


  game.style.display =
    "none";


  result.style.display =
    "block";


  const average =

    finalTime

    /

    totalQuestions

    /

    1000;


  document
    .getElementById(
      "resultTime"
    )
    .textContent =

      formatTime(
        finalTime
      );


  document
    .getElementById(
      "resultErrors"
    )
    .textContent =
      errors;


  document
    .getElementById(
      "resultCorrect"
    )
    .textContent =
      totalQuestions;


  document
    .getElementById(
      "resultAverage"
    )
    .textContent =

      average.toFixed(2)

      +

      " s";


  saveBestTime();

}



/* -------------------------
   BESTZEIT
-------------------------- */

function saveBestTime() {

  const key =

    "guitarBest_"

    +

    totalQuestions;


  const oldBest =

    Number(

      localStorage
        .getItem(
          key
        )

    );


  const bestTimeElement =

    document
      .getElementById(
        "bestTime"
      );


  if (errors > 0) {

    if (oldBest) {

      bestTimeElement.textContent =

        "Bestzeit ohne Fehler: "

        +

        formatTime(
          oldBest
        );

    }

    else {

      bestTimeElement.textContent =

        "Bestzeiten zählen nur ohne Fehler.";

    }


    return;

  }


  if (

    !oldBest

    ||

    finalTime
      <
      oldBest

  ) {

    localStorage.setItem(

      key,

      finalTime

    );


    bestTimeElement.textContent =

      "🏆 Neue Bestzeit: "

      +

      formatTime(
        finalTime
      );

  }

  else {

    bestTimeElement.textContent =

      "Bestzeit: "

      +

      formatTime(
        oldBest
      );

  }

}
