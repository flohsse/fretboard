<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gitarren Noten">

<title>Gitarren Noten Trainer</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #090909;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow: hidden;
}

button,
select {
  font: inherit;
}

/* ===============================
   APP
================================ */

.app {
  width: 100%;
  height: 100dvh;

  padding:
    max(3px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(3px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
}

/* ===============================
   PORTRAIT
================================ */

.orientation-warning {
  display: none;
  padding: 50px 20px;
  text-align: center;
  font-size: 22px;
}

@media (orientation: portrait) {

  .orientation-warning {
    display: block;
  }

  .main-content {
    display: none;
  }
}

/* ===============================
   START / RESULT
================================ */

.setup,
.result {
  max-width: 500px;
  margin: 25px auto;
  padding: 20px;

  background: #1b1b1e;
  border-radius: 18px;
}

.setup h1,
.result h2 {
  margin-top: 0;
  text-align: center;
}

.setup label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
}

select {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;

  border: none;
  border-radius: 12px;

  background: white;
  color: black;
}

.primary,
.secondary {
  width: 100%;
  padding: 13px;

  border: none;
  border-radius: 12px;

  font-weight: 800;
}

.primary {
  background: #39d274;
  color: #07150c;
}

.secondary {
  margin-top: 8px;
  background: #303035;
  color: white;
}

/* ===============================
   GAME
================================ */

.game {
  display: none;
}

/* ===============================
   STATUS
================================ */

.topbar {
  width: 84%;
  margin: 0 auto 4px;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.stat {
  height: 46px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      180deg,
      #1b1b1e,
      #151517
    );

  border-radius: 11px;

  font-size: 11px;
  font-weight: 600;
}

.stat span {
  margin-top: 1px;
  font-size: 17px;
  font-weight: 800;
}

/* ===============================
   GITARRENHALS BEREICH
================================ */

.neck-stage {
  position: relative;

  width: 100%;
  height: 245px;

  /*
    Perspektive für die Kippung
    um die Längsachse.
  */

  perspective: 900px;
  perspective-origin: 50% 35%;

  overflow: visible;
}

/*
  Dieser Container dreht den
  gesamten Hals leicht diagonal.
*/

.neck-angle {
  position: absolute;

  left: 4%;
  top: 30px;

  width: 94%;
  height: 185px;

  transform:
    rotateZ(8deg);

  transform-origin:
    50% 50%;
}

/*
  DAS IST DIE WICHTIGE KIPPUNG.

  rotateX kippt das Griffbrett
  um seine Längsachse.

  Positive Werte:
  hohe e-Seite kommt optisch
  zum Betrachter.
*/

.neck-roll {
  position: relative;

  width: 100%;
  height: 100%;

  transform:
    rotateX(43deg);

  transform-origin:
    center center;

  transform-style:
    preserve-3d;
}

/* ===============================
   GRIFFBRETT
================================ */

.fretboard {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 155px;

  background:

    repeating-linear-gradient(
      0deg,
      rgba(35, 10, 3, .28) 0px,
      rgba(35, 10, 3, .28) 3px,
      rgba(120, 52, 18, .14) 4px,
      rgba(60, 20, 7, .24) 7px
    ),

    linear-gradient(
      90deg,
      #643016,
      #3e1b0c
    );

  border:
    3px solid #29140a;

  border-radius:
    10px;

  box-shadow:
    0 15px 18px rgba(0,0,0,.58);

  overflow: hidden;

  transform-style:
    preserve-3d;
}

/*
  kleine Seitenkante an der
  hohen e-Seite.

  Dadurch wirkt diese Seite
  näher am Betrachter.
*/

.fretboard::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: -8px;

  height: 9px;

  background:
    linear-gradient(
      #c49a58,
      #8f642f
    );

  transform:
    rotateX(-90deg);

  transform-origin:
    bottom;

  z-index: 1;
}

/* ===============================
   SATTEL
================================ */

.nut {
  position: absolute;

  left: 0;
  top: 0;

  width: 8px;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      #a99e85,
      #fff7e6,
      #bdb096
    );

  box-shadow:
    2px 0 4px rgba(0,0,0,.6);

  z-index: 15;
}

/* ===============================
   BÜNDE
================================ */

.fret {
  position: absolute;

  top: 0;
  bottom: 0;

  width: 2px;

  transform:
    translateX(-1px);

  background:
    linear-gradient(
      90deg,
      #555,
      #f0f0f0,
      #777
    );

  box-shadow:
    1px 0 1px rgba(0,0,0,.4);

  z-index: 8;
}

/* ===============================
   SAITEN
================================ */

.string {
  position: absolute;

  left: 0;
  right: 0;

  transform:
    translateY(-50%);

  background:
    linear-gradient(
      180deg,
      #555,
      #eee,
      #666
    );

  box-shadow:
    0 1px 1px rgba(0,0,0,.7);

  z-index: 12;
}

.s1 { height: 1px; }
.s2 { height: 1.2px; }
.s3 { height: 1.5px; }
.s4 { height: 2px; }
.s5 { height: 2.5px; }
.s6 { height: 3px; }

/* ===============================
   LES-PAUL TRAPEZE
================================ */

.inlay {
  position: absolute;

  width: 26px;
  height: 38px;

  transform:
    translate(-50%, -50%);

  clip-path:
    polygon(
      15% 0,
      85% 0,
      70% 100%,
      30% 100%
    );

  background:
    linear-gradient(
      135deg,
      #fff,
      #d3c8a9,
      #fff,
      #cfc5a9
    );

  opacity: .9;

  z-index: 5;
}

.inlay.twelve {
  width: 31px;
  height: 48px;
}

/* ===============================
   ZIEL
================================ */

.target {
  position: absolute;

  width: 29px;
  height: 29px;

  border-radius: 50%;

  background: #ff4141;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px rgba(255,65,65,.25),
    0 4px 9px rgba(0,0,0,.55);

  transform:
    translate(-50%, -50%)
    translateZ(8px);

  z-index: 25;
}

/* ===============================
   BUNDNUMMERN
================================ */

.fret-labels {
  position: absolute;

  left: 0;
  top: 160px;

  width: 100%;
  height: 18px;

  pointer-events: none;
}

.fret-label {
  position: absolute;

  transform:
    translateX(-50%);

  font-size: 9px;
  font-weight: 700;

  color: #d1d1d4;
}

/* ===============================
   NOTENBUTTONS
================================ */

.notes {
  position: relative;

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 6px;

  margin-top: 1px;
}

.note-btn {
  height: 43px;

  border: none;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      #2c2c31,
      #252529
    );

  color: white;

  font-size: 18px;
  font-weight: 800;
}

.note-btn:active {
  transform:
    scale(.97);
}

.note-btn.correct {
  background:
    #22b85d !important;
}

.note-btn.wrong {
  background:
    #db3a3a !important;
}

/* ===============================
   RESULT
================================ */

.result {
  display: none;
}

.result-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin: 16px 0;
}

.result-box {
  padding: 10px;

  text-align: center;

  border-radius: 11px;

  background: #29292d;
}

.result-value {
  margin-top: 4px;

  font-size: 23px;

  font-weight: 800;
}

.best {
  margin-bottom: 14px;

  text-align: center;

  font-weight: 700;
}

/* ===============================
   KLEINE IPHONES
================================ */

@media
(orientation: landscape)
and
(max-height: 430px) {

  .topbar {
    height: 38px;
  }

  .stat {
    height: 38px;
    font-size: 9px;
  }

  .stat span {
    font-size: 14px;
  }

  .neck-stage {
    height: 204px;
  }

  .neck-angle {
    top: 18px;
    height: 160px;
  }

  .fretboard {
    height: 135px;
  }

  .fret-labels {
    top: 140px;
  }

  .note-btn {
    height: 37px;
    font-size: 16px;
  }

  .inlay {
    width: 21px;
    height: 31px;
  }

  .inlay.twelve {
    width: 25px;
    height: 38px;
  }

  .target {
    width: 25px;
    height: 25px;
  }
}

</style>
</head>

<body>

<div class="app">

<div class="orientation-warning">
🎸 Bitte das iPhone ins Querformat drehen.
</div>

<div class="main-content">

<!-- =========================
     START
========================= -->

<div
  id="setup"
  class="setup"
>

<h1>
🎸 Gitarren Noten Trainer
</h1>

<label for="questionCount">
Anzahl der Noten

<select id="questionCount">

<option value="10">

<option

>

Ø pro Note

<script>

/* ===============================
   NOTEN
================================ */

const notes = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


/*
Standardstimmung:

hohe e
B
G
D
A
tiefe E
*/

const openStrings = [
  4,
  11,
  7,
  2,
  9,
  4
];


/* ===============================
   ELEMENTE
================================ */

const setup =
  document.getElementById(
    "setup"
  );

const game =
  document.getElementById(
    "game"
  );

const result =
  document.getElementById(
    "result"
  );

const frets =
  document.getElementById(
    "frets"
  );

const strings =
  document.getElementById(
    "strings"
  );

const inlays =
  document.getElementById(
    "inlays"
  );

const fretLabels =
  document.getElementById(
    "fretLabels"
  );

const target =
  document.getElementById(
    "target"
  );

const noteButtons =
  document.getElementById(
    "noteButtons"
  );

const progress =
  document.getElementById(
    "progress"
  );

const timerDisplay =
  document.getElementById(
    "timer"
  );

const correctDisplay =
  document.getElementById(
    "correctCount"
  );

const wrongDisplay =
  document.getElementById(
    "wrongCount"
  );


/* ===============================
   SPIELVARIABLEN
================================ */

let totalQuestions = 20;

let completedQuestions = 0;

let errors = 0;

let currentString = 0;

let currentFret = 0;

let correctNote = "";

let previousString = -1;

let previousFret = -1;

let startTime = 0;

let finalTime = 0;

let timerInterval = null;

let inputLocked = false;


/* ===============================
   BUNDPOSITIONEN
================================ */

const fretPositions = [];


function calculateFretPositions() {

  fretPositions.length = 0;


  const rawMax =

    1 -

    Math.pow(
      2,
      -22 / 12
    );


  fretPositions.push(0);


  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const raw =

      1 -

      Math.pow(
        2,
        -fret / 12
      );


    fretPositions.push(

      raw
      /
      rawMax
      *
      100

    );

  }

}


function getFretCenter(fret) {

  const left =

    fret === 1

      ? 0

      : fretPositions[
          fret - 1
        ];


  const right =
    fretPositions[fret];


  return (
    left + right
  ) / 2;

}


/* ===============================
   SAITENPOSITION
================================ */

function getStringY(
  stringIndex
) {

  /*
  genügend Rand oben/unten
  */

  return (

    8

    +

    stringIndex
    *
    16.8

  );

}


/* ===============================
   GRIFFBRETT BAUEN
================================ */

function buildFretboard() {

  frets.innerHTML = "";

  strings.innerHTML = "";

  inlays.innerHTML = "";

  fretLabels.innerHTML = "";


  /* BÜNDE */

  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const line =
      document.createElement(
        "div"
      );


    line.className =
      "fret";


    line.style.left =

      fretPositions[fret]

      +

      "%";


    frets.appendChild(
      line
    );


    /* NUMMER */

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "fret-label";


    label.textContent =
      fret;


    label.style.left =

      getFretCenter(fret)

      +

      "%";


    fretLabels.appendChild(
      label
    );

  }


  /* SAITEN */

  for (
    let string = 0;
    string < 6;
    string++
  ) {

    const line =
      document.createElement(
        "div"
      );


    line.className =

      "string s"

      +

      (string + 1);


    line.style.top =

      getStringY(string)

      +

      "%";


    strings.appendChild(
      line
    );

  }


  /* LES-PAUL INLAYS */

  const inlayFrets = [
    3,
    5,
    7,
    9,
    12,
    15,
    17,
    19,
    21
  ];


  inlayFrets.forEach(
    fret => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "inlay";


      if (
        fret === 12
      ) {

        element.classList.add(
          "twelve"
        );

      }


      element.style.left =

        getFretCenter(fret)

        +

        "%";


      element.style.top =
        "50%";


      inlays.appendChild(
        element
      );

    }
  );

}


/* ===============================
   NOTENTASTEN
================================ */

function buildNoteButtons() {

  noteButtons.innerHTML = "";


  notes.forEach(
    note => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "note-btn";


      button.dataset.note =
        note;


      button.textContent =
        note;


      button.addEventListener(
        "click",
        () => answer(
          note,
          button
        )
      );


      noteButtons.appendChild(
        button
      );

    }
  );

}


/* ===============================
   FEEDBACK
================================ */

function clearFeedback() {

  document
    .querySelectorAll(
      ".note-btn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "correct",
          "wrong"
        );

      }
    );

}


/* ===============================
   START
================================ */

function startGame() {

  totalQuestions =

    Number(

      document
        .getElementById(
          "questionCount"
        )
        .value

    );


  completedQuestions = 0;

  errors = 0;

  previousString = -1;

  previousFret = -1;

  inputLocked = false;


  correctDisplay.textContent =
    "0";

  wrongDisplay.textContent =
    "0";


  setup.style.display =
    "none";

  result.style.display =
    "none";

  game.style.display =
    "block";


  clearFeedback();


  startTime =
    performance.now();


  clearInterval(
    timerInterval
  );


  timerInterval =
    setInterval(
      updateTimer,
      50
    );


  nextQuestion();

}


/* ===============================
   NÄCHSTE AUFGABE
================================ */

function nextQuestion() {

  clearFeedback();

  inputLocked =
    false;


  progress.textContent =

    (
      completedQuestions
      +
      1
    )

    +

    " / "

    +

    totalQuestions;


  let newString;

  let newFret;


  do {

    newString =

      Math.floor(
        Math.random() * 6
      );


    newFret =

      Math.floor(
        Math.random() * 22
      )

      +

      1;

  }

  while (

    newString
      ===
      previousString

    &&

    newFret
      ===
      previousFret

  );


  currentString =
    newString;

  currentFret =
    newFret;


  previousString =
    newString;

  previousFret =
    newFret;


  const noteIndex =

    (
      openStrings[
        currentString
      ]

      +

      currentFret
    )

    %

    12;


  correctNote =
    notes[noteIndex];


  positionTarget();

}


/* ===============================
   ROTE MARKIERUNG
================================ */

function positionTarget() {

  target.style.left =

    getFretCenter(
      currentFret
    )

    +

    "%";


  target.style.top =

    getStringY(
      currentString
    )

    +

    "%";

}


/* ===============================
   ANTWORT
================================ */

function answer(
  selectedNote,
  button
) {

  if (inputLocked) {
    return;
  }


  /* RICHTIG */

  if (
    selectedNote
      ===
      correctNote
  ) {

    inputLocked =
      true;


    button
      .classList
      .add(
        "correct"
      );


    completedQuestions++;


    correctDisplay.textContent =
      completedQuestions;


    setTimeout(
      () => {

        if (

          completedQuestions
            >=
            totalQuestions

        ) {

          endGame();

        }

        else {

          nextQuestion();

        }

      },
      180
    );

  }


  /* FALSCH */

  else {

    inputLocked =
      true;


    errors++;


    wrongDisplay.textContent =
      errors;


    button
      .classList
      .add(
        "wrong"
      );


    const correctButton =

      document
        .querySelector(

          `.note-btn[data-note="${correctNote}"]`

        );


    if (correctButton) {

      correctButton
        .classList
        .add(
          "correct"
        );

    }


    setTimeout(
      () => {

        clearFeedback();

        inputLocked =
          false;

      },
      400
    );

  }

}


/* ===============================
   TIMER
================================ */

function updateTimer() {

  const elapsed =

    performance.now()

    -

    startTime;


  timerDisplay.textContent =

    formatTime(
      elapsed
    );

}


function formatTime(
  milliseconds
) {

  const totalSeconds =
    milliseconds / 1000;


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    Math.floor(
      totalSeconds % 60
    );


  const tenths =
    Math.floor(

      (
        totalSeconds % 1
      )

      *

      10

    );


  return (

    String(minutes)
      .padStart(
        2,
        "0"
      )

    +

    ":"

    +

    String(seconds)
      .padStart(
        2,
        "0"
      )

    +

    "."

    +

    tenths

  );

}


/* ===============================
   ENDE
================================ */

function endGame() {

  clearInterval(
    timerInterval
  );


  finalTime =

    performance.now()

    -

    startTime;


  game.style.display =
    "none";


  result.style.display =
    "block";


  const average =

    finalTime

    /

    totalQuestions

    /

    1000;


  document
    .getElementById(
      "resultTime"
    )
    .textContent =

      formatTime(
        finalTime
      );


  document
    .getElementById(
      "resultErrors"
    )
    .textContent =
      errors;


  document
    .getElementById(
      "resultCorrect"
    )
    .textContent =
      totalQuestions;


  document
    .getElementById(
      "resultAverage"
    )
    .textContent =

      average.toFixed(2)

      +

      " s";


  saveBestTime();

}


/* ===============================
   BESTZEIT
================================ */

function saveBestTime() {

  const key =

    "guitarBest_"

    +

    totalQuestions;


  const oldBest =

    Number(

      localStorage
        .getItem(
          key
        )

    );


  const display =

    document
      .getElementById(
        "bestTime"
      );


  if (
    errors > 0
  ) {

    if (oldBest) {

      display.textContent =

        "Bestzeit ohne Fehler: "

        +

        formatTime(
          oldBest
        );

    }

    else {

      display.textContent =

        "Bestzeiten zählen nur ohne Fehler.";

    }


    return;

  }


  if (

    !oldBest

    ||

    finalTime
      <
      oldBest

  ) {

    localStorage.setItem(

      key,

      finalTime

    );


    display.textContent =

      "🏆 Neue Bestzeit: "

      +

      formatTime(
        finalTime
      );

  }

  else {

    display.textContent =

      "Bestzeit: "

      +

      formatTime(
        oldBest
      );

  }

}


/* ===============================
   EVENTS
================================ */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById(
    "againButton"
  )
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById(
    "menuButton"
  )
  .addEventListener(
    "click",
    () => {

      result.style.display =
        "none";

      setup.style.display =
        "block";

    }
  );


/* INITIALISIERUNG */

calculateFretPositions();

buildFretboard();

buildNoteButtons();
