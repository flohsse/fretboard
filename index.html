<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gitarren Noten">

<title>Gitarren Noten Trainer</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #0d0d0f;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow: hidden;
}

button,
select {
  font: inherit;
}

.app {
  width: 100%;
  height: 100vh;

  padding:
    max(3px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(3px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
}


/* ------------------------
   PORTRAIT
------------------------ */

.orientation-warning {
  display: none;
  padding: 50px 20px;
  text-align: center;
  font-size: 22px;
}

@media (orientation: portrait) {

  .orientation-warning {
    display: block;
  }

  .main-content {
    display: none;
  }

}


/* ------------------------
   START / RESULT
------------------------ */

.setup,
.result {

  max-width: 520px;
  margin: 20px auto;

  padding: 18px;

  background: #1b1b1e;

  border-radius: 18px;
}

.setup h1,
.result h2 {
  margin-top: 0;
  text-align: center;
}

.setup label {
  display: block;
  margin-bottom: 7px;
  font-weight: 700;
}

select {

  width: 100%;

  padding: 11px;

  border: none;

  border-radius: 11px;

  margin-bottom: 14px;
}

.primary,
.secondary {

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 12px;

  font-weight: 800;
}

.primary {
  background: #37d071;
  color: #07140b;
}

.secondary {

  margin-top: 8px;

  background: #323237;
  color: white;
}


/* ------------------------
   GAME
------------------------ */

.game {
  display: none;
}


/* ------------------------
   STATUS
------------------------ */

.topbar {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 6px;

  margin-bottom: 5px;
}

.stat {

  padding: 4px;

  background: #202024;

  border-radius: 10px;

  text-align: center;

  font-size: 12px;

  font-weight: 700;
}

.stat span {
  font-size: 15px;
}


/* ------------------------
   BOARD AREA
------------------------ */

.board-section {

  position: relative;

  width: 100%;

  height: 231px;

  margin-bottom: 4px;
}


/*
Das Griffbrett wird nicht als
Rechteck dargestellt.

Links am Sattel schmal,
rechts breiter.
*/

.fretboard {

  position: absolute;

  left: 0;
  right: 0;

  top: 8px;

  height: 205px;

  overflow: visible;
}


/* Holzfläche */

.wood {

  position: absolute;

  inset: 0;

  clip-path: polygon(
    0% 20%,
    100% 0%,
    100% 100%,
    0% 80%
  );

  background:

    repeating-linear-gradient(
      0deg,
      rgba(40,12,3,.22) 0px,
      rgba(40,12,3,.22) 3px,
      rgba(130,55,20,.14) 4px,
      rgba(60,20,6,.22) 7px
    ),

    linear-gradient(
      90deg,
      #683117,
      #4b200e
    );

  border-radius: 10px;

  box-shadow:
    0 5px 16px rgba(0,0,0,.55);

  z-index: 1;
}


/* dunkler Rand */

.board-outline {

  position: absolute;

  inset: 0;

  clip-path: polygon(
    0% 20%,
    100% 0%,
    100% 100%,
    0% 80%
  );

  border: 3px solid #271309;

  border-radius: 10px;

  pointer-events: none;

  z-index: 20;
}


/* ------------------------
   SATTEL
------------------------ */

.nut {

  position: absolute;

  left: 0;

  top: 20%;

  height: 60%;

  width: 7px;

  background:
    linear-gradient(
      90deg,
      #bfb39a,
      #fff5df,
      #b6aa92
    );

  z-index: 12;

  box-shadow:
    2px 0 3px rgba(0,0,0,.6);
}


/* ------------------------
   BÜNDE
------------------------ */

.fret {

  position: absolute;

  width: 2px;

  background:
    linear-gradient(
      90deg,
      #666,
      #eee,
      #777
    );

  transform-origin: center;

  z-index: 6;

  box-shadow:
    1px 0 1px rgba(0,0,0,.4);
}


/* ------------------------
   SAITEN
------------------------ */

.string {

  position: absolute;

  left: 0;

  height: 2px;

  transform-origin: left center;

  z-index: 9;

  background:
    linear-gradient(
      180deg,
      #5d5d5d,
      #ececec,
      #666
    );

  box-shadow:
    0 1px 1px rgba(0,0,0,.65);
}

.string.s1 { height: 1px; }
.string.s2 { height: 1.2px; }
.string.s3 { height: 1.6px; }
.string.s4 { height: 2px; }
.string.s5 { height: 2.6px; }
.string.s6 { height: 3.1px; }


/* ------------------------
   INLAYS
------------------------ */

.inlay {

  position: absolute;

  transform:
    translate(-50%, -50%);

  width: 22px;
  height: 31px;

  clip-path:
    polygon(
      17% 0,
      83% 0,
      70% 100%,
      30% 100%
    );

  background:
    linear-gradient(
      135deg,
      #fff,
      #d3c8aa,
      #fff
    );

  opacity: .9;

  z-index: 4;

  box-shadow:
    inset 0 0 4px rgba(255,255,255,.8);
}

.inlay.twelve {

  width: 27px;
  height: 40px;
}


/* ------------------------
   TARGET
------------------------ */

.target {

  position: absolute;

  width: 29px;
  height: 29px;

  border-radius: 50%;

  background: #ff4242;

  border: 3px solid white;

  box-shadow:
    0 0 0 4px rgba(255,66,66,.25),
    0 3px 8px rgba(0,0,0,.55);

  transform:
    translate(-50%, -50%);

  z-index: 15;
}


/* ------------------------
   FRET NUMBERS
------------------------ */

.fret-labels {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 19px;
}

.fret-label {

  position: absolute;

  transform:
    translateX(-50%);

  color: #c9c9cd;

  font-size: 10px;

  font-weight: 700;
}


/* ------------------------
   NOTE BUTTONS
------------------------ */

.notes {

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 6px;
}

.note-btn {

  height: 43px;

  border: none;

  border-radius: 10px;

  background: #2b2b30;

  color: white;

  font-size: 18px;

  font-weight: 800;
}

.note-btn:active {
  transform: scale(.97);
}

.note-btn.correct {
  background: #24b95e !important;
}

.note-btn.wrong {
  background: #db3b3b !important;
}


/* ------------------------
   RESULT
------------------------ */

.result {
  display: none;
}

.result-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin: 16px 0;
}

.result-box {

  padding: 10px;

  background: #29292d;

  border-radius: 11px;

  text-align: center;
}

.result-value {

  margin-top: 4px;

  font-size: 23px;

  font-weight: 800;
}

.best {
  text-align: center;
  font-weight: 700;
  margin-bottom: 14px;
}


/* ------------------------
   KLEINE IPHONES
------------------------ */

@media
(orientation: landscape)
and
(max-height: 430px) {

  .board-section {
    height: 198px;
  }

  .fretboard {
    height: 173px;
  }

  .note-btn {
    height: 38px;
    font-size: 16px;
  }

  .topbar {
    gap: 4px;
    margin-bottom: 3px;
  }

  .stat {
    padding: 2px;
    font-size: 10px;
  }

  .stat span {
    font-size: 13px;
  }

  .inlay {
    width: 18px;
    height: 26px;
  }

  .inlay.twelve {
    width: 22px;
    height: 33px;
  }

  .target {
    width: 25px;
    height: 25px;
  }

}

</style>
</head>

<body>

<div class="app">

<div class="orientation-warning">
🎸 Bitte das iPhone ins Querformat drehen.
</div>

<div class="main-content">


<!-- START -->

<div
  id="setup"
  class="setup"
>

<h1>
🎸 Gitarren Noten Trainer
</h1>

<label for="questionCount">
Anzahl der Noten
</label>

<select id="questionCount">

<option value="10">
10 Noten
</option>

<option
  value="20"
  selected
>
20 Noten
</option>

<option value="30">
30 Noten
</option>

<option value="50">
50 Noten
</option>

<option value="100">
100 Noten
</option>

</select>

<button
  id="startButton"
  class="primary"
>
Training starten
</button>

</div>



<!-- GAME -->

<div
  id="game"
  class="game"
>

<div class="topbar">

<div class="stat">
Note<br>
<span id="progress">
1 / 20
</span>
</div>

<div class="stat">
⏱ Zeit<br>
<span id="timer">
00:00.0
</span>
</div>

<div class="stat">
✓ Richtig<br>
<span id="correctCount">
0
</span>
</div>

<div class="stat">
✕ Fehler<br>
<span id="wrongCount">
0
</span>
</div>

</div>



<div class="board-section">

<div
  id="fretboard"
  class="fretboard"
>

<div class="wood"></div>

<div class="board-outline"></div>

<div class="nut"></div>

<div id="frets"></div>

<div id="inlays"></div>

<div id="strings"></div>

<div
  id="target"
  class="target"
></div>

</div>

<div
  id="fretLabels"
  class="fret-labels"
></div>

</div>

  id="noteButtons"
  class="notes"
></div>

</div>



<!-- RESULT -->

<div
  id="result"
  class="result"
>

<h2>
Training beendet 🎸
</h2>

<div class="result-grid">

<div class="result-box">
Gesamtzeit
<div
  id="resultTime"
  class="result-value"
></div>
</div>

<div class="result-box">
Fehler
<div
  id="resultErrors"

></div>
</div>

<div class="result-box">
Noten
<div
  id="resultCorrect"
  class="result-value"
></div>
</div>

<div class="result-box">
Ø pro Note
<div
  id="resultAverage"
  class="result-value"
></div>
</div>

</div>

<div
  id="bestTime"
  class="best"
></div>

<button
  id="againButton"
  class="primary"
>
Nochmal
</button>

<button
  id="menuButton"
  class="secondary"
>
Anzahl ändern
</button>

</div>


</div>
</div>


<script>


/* ------------------------
   NOTES
------------------------ */

const notes = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


const openStrings = [
  4,
  11,
  7,
  2,
  9,
  4
];


/* ------------------------
   ELEMENTS
------------------------ */

const setup =
  document.getElementById("setup");

const game =
  document.getElementById("game");

const result =
  document.getElementById("result");

const fretboard =
  document.getElementById("fretboard");

const frets =
  document.getElementById("frets");

const strings =
  document.getElementById("strings");

const inlays =
  document.getElementById("inlays");

const fretLabels =
  document.getElementById("fretLabels");

const target =
  document.getElementById("target");

const noteButtons =
  document.getElementById("noteButtons");

const progress =
  document.getElementById("progress");

const timerDisplay =
  document.getElementById("timer");

const correctDisplay =
  document.getElementById("correctCount");

const wrongDisplay =
  document.getElementById("wrongCount");


/* ------------------------
   VARIABLES
------------------------ */

let totalQuestions = 20;

let completedQuestions = 0;

let errors = 0;

let currentString = 0;

let currentFret = 0;

let correctNote = "";

let previousString = -1;

let previousFret = -1;

let startTime = 0;

let finalTime = 0;

let timerInterval = null;

let inputLocked = false;


/* ------------------------
   FRET POSITIONS
------------------------ */

const fretPositions = [];


function calculateFretPositions() {

  fretPositions.length = 0;

  const rawMax =
    1 -
    Math.pow(
      2,
      -22 / 12
    );

  fretPositions.push(0);


  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const raw =
      1 -
      Math.pow(
        2,
        -fret / 12
      );

    fretPositions.push(
      raw / rawMax * 100
    );

  }

}


function getFretCenter(fret) {

  const left =
    fret === 1
    ? 0
    : fretPositions[fret - 1];

  const right =
    fretPositions[fret];

  return (
    left + right
  ) / 2;

}


/* ------------------------
   BOARD PERSPECTIVE
------------------------ */

/*
Links ist das Griffbrett
schmaler.

Rechts Richtung Korpus
wird es breiter.

x = Prozent von links nach rechts
*/

function getTopEdge(x) {

  /*
  links 20 %
  rechts 0 %
  */

  return 20 * (1 - x / 100);

}


function getBottomEdge(x) {

  /*
  links 80 %
  rechts 100 %
  */

  return 80 + 20 * (x / 100);

}


/*
Position einer Saite
innerhalb des Griffbrettes.

0 = hohe E
5 = tiefe E
*/

function getStringYAtX(
  stringIndex,
  x
) {

  const top =
    getTopEdge(x);

  const bottom =
    getBottomEdge(x);

  /*
  etwas Abstand zum Rand
  */

  const padding = 7;

  const usableTop =
    top + padding;

  const usableBottom =
    bottom - padding;

  return (
    usableTop
    +
    (
      usableBottom
      -
      usableTop
    )
    *
    (
      stringIndex / 5
    )
  );

}


/* ------------------------
   BUILD BOARD
------------------------ */

function buildFretboard() {

  frets.innerHTML = "";

  strings.innerHTML = "";

  inlays.innerHTML = "";

  fretLabels.innerHTML = "";


  buildFrets();

  buildStrings();

  buildInlays();

  buildLabels();

}


/* ------------------------
   FRETS
------------------------ */

function buildFrets() {

  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const x =
      fretPositions[fret];


    const top =
      getTopEdge(x);


    const bottom =
      getBottomEdge(x);


    const line =
      document.createElement("div");


    line.className =
      "fret";


    line.style.left =
      x + "%";


    line.style.top =
      top + "%";


    line.style.height =
      (
        bottom - top
      )
      +
      "%";


    frets.appendChild(line);

  }

}


/* ------------------------
   STRINGS
------------------------ */

function buildStrings() {

  for (
    let s = 0;
    s < 6;
    s++
  ) {

    const line =
      document.createElement("div");


    line.className =
      "string s"
      +
      (s + 1);


    /*
    Anfang und Ende der Saite
    */

    const y1 =
      getStringYAtX(
        s,
        0
      );

    const y2 =
      getStringYAtX(
        s,
        100
      );


    const boardWidth =
      fretboard.clientWidth;


    const boardHeight =
      fretboard.clientHeight;


    const dy =
      (
        y2 - y1
      )
      /
      100
      *
      boardHeight;


    const angle =
      Math.atan2(
        dy,
        boardWidth
      )
      *
      180
      /
      Math.PI;


    const length =
      Math.sqrt(
        boardWidth * boardWidth
        +
        dy * dy
      );


    line.style.top =
      y1 + "%";


    line.style.width =
      length + "px";


    line.style.transform =
      `rotate(${angle}deg)`;


    strings.appendChild(line);

  }

}


/* ------------------------
   INLAYS
------------------------ */

function buildInlays() {

  const inlayFrets = [
    3,
    5,
    7,
    9,
    12,
    15,
    17,
    19,
    21
  ];


  inlayFrets.forEach(
    fret => {

      const x =
        getFretCenter(fret);


      const y =
        (
          getTopEdge(x)
          +
          getBottomEdge(x)
        )
        /
        2;


      const inlay =
        document.createElement(
          "div"
        );


      inlay.className =
        "inlay";


      if (
        fret === 12
      ) {

        inlay.classList.add(
          "twelve"
        );

      }


      inlay.style.left =
        x + "%";


      inlay.style.top =
        y + "%";


      inlays.appendChild(
        inlay
      );

    }
  );

}


/* ------------------------
   LABELS
------------------------ */

function buildLabels() {

  for (
    let fret = 1;
    fret <= 22;
    fret++
  ) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "fret-label";


    label.textContent =
      fret;


    label.style.left =
      getFretCenter(fret)
      +
      "%";


    fretLabels.appendChild(
      label
    );

  }

}


/* ------------------------
   NOTE BUTTONS
------------------------ */

function buildNoteButtons() {

  noteButtons.innerHTML = "";


  notes.forEach(
    note => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "note-btn";


      button.textContent =
        note;


      button.dataset.note =
        note;


      button.addEventListener(
        "click",
        () => answer(
          note,
          button
        )
      );


      noteButtons.appendChild(
        button
      );

    }
  );

}


/* ------------------------
   FEEDBACK
------------------------ */

function clearButtonFeedback() {

  document
    .querySelectorAll(
      ".note-btn"
    )
    .forEach(
      button => {

        button.classList.remove(
          "correct",
          "wrong"
        );

      }
    );

}


/* ------------------------
   START GAME
------------------------ */

function startGame() {

  totalQuestions =
    Number(
      document
        .getElementById(
          "questionCount"
        )
        .value
    );


  completedQuestions = 0;

  errors = 0;

  previousString = -1;

  previousFret = -1;

  inputLocked = false;


  correctDisplay.textContent =
    "0";

  wrongDisplay.textContent =
    "0";


  setup.style.display =
    "none";

  result.style.display =
    "none";

  game.style.display =
    "block";


  /*
  nach dem Anzeigen
  neu berechnen
  */

  setTimeout(
    () => {

      buildFretboard();

      nextQuestion();

    },
    30
  );


  startTime =
    performance.now();


  clearInterval(
    timerInterval
  );


  timerInterval =
    setInterval(
      updateTimer,
      50
    );

}


/* ------------------------
   NEXT QUESTION
------------------------ */

function nextQuestion() {

  clearButtonFeedback();

  inputLocked = false;


  progress.textContent =
    (
      completedQuestions + 1
    )
    +
    " / "
    +
    totalQuestions;


  let newString;

  let newFret;


  do {

    newString =
      Math.floor(
        Math.random() * 6
      );


    newFret =
      Math.floor(
        Math.random() * 22
      )
      +
      1;

  }
  while (

    newString ===
      previousString

    &&

    newFret ===
      previousFret

  );


  currentString =
    newString;

  currentFret =
    newFret;


  previousString =
    newString;

  previousFret =
    newFret;


  const noteIndex =
    (
      openStrings[
        currentString
      ]
      +
      currentFret
    )
    %
    12;


  correctNote =
    notes[noteIndex];


  positionTarget();

}


/* ------------------------
   TARGET POSITION
------------------------ */

function positionTarget() {

  const x =
    getFretCenter(
      currentFret
    );


  const y =
    getStringYAtX(
      currentString,
      x
    );


  target.style.left =
    x + "%";


  target.style.top =
    y + "%";

}


/* ------------------------
   ANSWER
------------------------ */

function answer(
  selectedNote,
  selectedButton
) {

  if (inputLocked) {
    return;
  }


  if (
    selectedNote ===
    correctNote
  ) {

    inputLocked = true;


    selectedButton
      .classList
      .add(
        "correct"
      );


    completedQuestions++;


    correctDisplay.textContent =
      completedQuestions;


    setTimeout(
      () => {

        if (
          completedQuestions
          >=
          totalQuestions
        ) {

          endGame();

        }
        else {

          nextQuestion();

        }

      },
      180
    );

  }

  else {

    inputLocked = true;


    errors++;


    wrongDisplay.textContent =
      errors;


    selectedButton
      .classList
      .add(
        "wrong"
      );


    const correctButton =
      document.querySelector(
        `.note-btn[data-note="${correctNote}"]`
      );


    if (correctButton) {

      correctButton
        .classList
        .add(
          "correct"
        );

    }


    setTimeout(
      () => {

        clearButtonFeedback();

        inputLocked = false;

      },
      400
    );

  }

}


/* ------------------------
   TIMER
------------------------ */

function updateTimer() {

  timerDisplay.textContent =
    formatTime(
      performance.now()
      -
      startTime
    );

}


function formatTime(
  milliseconds
) {

  const totalSeconds =
    milliseconds / 1000;


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    Math.floor(
      totalSeconds % 60
    );


  const tenths =
    Math.floor(
      (
        totalSeconds % 1
      )
      *
      10
    );


  return (
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(seconds)
      .padStart(2, "0")
    +
    "."
    +
    tenths
  );

}


/* ------------------------
   END
------------------------ */

function endGame() {

  clearInterval(
    timerInterval
  );


  finalTime =
    performance.now()
    -
    startTime;


  game.style.display =
    "none";


  result.style.display =
    "block";


  const average =
    finalTime
    /
    totalQuestions
    /
    1000;


  document
    .getElementById(
      "resultTime"
    )
    .textContent =
      formatTime(
        finalTime
      );


  document
    .getElementById(
      "resultErrors"
    )
    .textContent =
      errors;


  document
    .getElementById(
      "resultCorrect"
    )
    .textContent =
      totalQuestions;


  document
    .getElementById(
      "resultAverage"
    )
    .textContent =
      average.toFixed(2)
      +
      " s";


  saveBestTime();

}


/* ------------------------
   BEST TIME
------------------------ */

function saveBestTime() {

  const key =
    "guitarBest_"
    +
    totalQuestions;


  const oldBest =
    Number(
      localStorage
        .getItem(key)
    );


  const element =
    document.getElementById(
      "bestTime"
    );


  if (errors > 0) {

    if (oldBest) {

      element.textContent =
        "Bestzeit ohne Fehler: "
        +
        formatTime(
          oldBest
        );

    }
    else {

      element.textContent =
        "Bestzeiten zählen nur ohne Fehler.";

    }

    return;

  }


  if (
    !oldBest
    ||
    finalTime < oldBest
  ) {

    localStorage.setItem(
      key,
      finalTime
    );


    element.textContent =
      "🏆 Neue Bestzeit: "
      +
      formatTime(
        finalTime
      );

  }
  else {

    element.textContent =
      "Bestzeit: "
      +
      formatTime(
        oldBest
      );

  }

}


/* ------------------------
   EVENTS
------------------------ */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById(
    "againButton"
  )
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById(
    "menuButton"
  )
  .addEventListener(
    "click",
    () => {

      result.style.display =
        "none";

      setup.style.display =
        "block";

    }
  );


window.addEventListener(
  "resize",
  () => {

    if (
      game.style.display ===
      "block"
    ) {

      buildFretboard();

      positionTarget();

    }

  }
);


/* ------------------------
   INITIALIZE
------------------------ */

calculateFretPositions();

buildNoteButtons();

</script>
