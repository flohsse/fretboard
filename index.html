<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f0f10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gitarren Noten">

  <title>Gitarren Noten Trainer</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0f0f10;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    select {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;

      padding:
        max(6px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .orientation-warning {
      display: none;
      padding: 40px 20px;
      text-align: center;
      font-size: 22px;
    }

    .setup,
    .result {
      max-width: 520px;
      margin: 25px auto;
      background: #1b1b1e;
      border-radius: 18px;
      padding: 20px;
    }

    .setup h1,
    .result h2 {
      margin-top: 0;
      text-align: center;
    }

    .setup label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
    }

    .primary,
    .secondary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: #39d375;
      color: #08150d;
    }

    .secondary {
      background: #333338;
      color: white;
      margin-top: 8px;
    }

    .game {
      display: none;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 6px;
    }

    .stat {
      min-width: 0;
      background: #202024;
      border-radius: 10px;
      text-align: center;
      padding: 6px 4px;
      font-size: 14px;
      font-weight: 700;
    }

    .board-section {
      position: relative;
      width: 100%;
      margin-bottom: 8px;
    }

    .fretboard {
      position: relative;
      width: 100%;
      height: 255px;
      overflow: hidden;

      border-radius: 12px;
      border: 3px solid #271208;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(60, 22, 6, 0.25) 0px,
          rgba(60, 22, 6, 0.25) 4px,
          rgba(130, 62, 25, 0.15) 5px,
          rgba(74, 28, 10, 0.25) 8px
        ),
        linear-gradient(
          90deg,
          #6b3418,
          #4d2311
        );

      box-shadow: 0 5px 18px rgba(0,0,0,0.45);
    }

    .nut {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 7px;
      background: #eee4cf;
      z-index: 8;
      box-shadow: 2px 0 4px rgba(0,0,0,0.5);
    }

    .fret {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;

      background:
        linear-gradient(
          90deg,
          #777,
          #f0f0f0,
          #777
        );

      z-index: 4;
    }

    .string {
      position: absolute;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      z-index: 6;

      background:
        linear-gradient(
          180deg,
          #666,
          #eee,
          #666
        );

      box-shadow: 0 1px 1px rgba(0,0,0,0.7);
    }

    .s1 { height: 1px; }
    .s2 { height: 1.4px; }
    .s3 { height: 1.8px; }
    .s4 { height: 2.2px; }
    .s5 { height: 2.8px; }
    .s6 { height: 3.4px; }

    .marker {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(242, 226, 190, 0.85);
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .target {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;

      background: #ff4141;
      border: 3px solid white;

      box-shadow:
        0 0 0 4px rgba(255,65,65,0.22),
        0 4px 10px rgba(0,0,0,0.55);

      transform: translate(-50%, -50%);
      z-index: 12;
    }

    .fret-labels {
      position: relative;
      width: 100%;
      height: 24px;
      margin-top: 1px;
    }

    .fret-label {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 11px;
      color: #bbbbbf;
      font-weight: 700;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }

    .note-btn {
      min-height: 52px;
      border: none;
      border-radius: 11px;

      background: #2c2c31;
      color: white;

      font-size: 18px;
      font-weight: 800;

      transition:
        transform 0.08s,
        background 0.1s;
    }

    .note-btn:active {
      transform: scale(0.97);
    }

    .note-btn.correct {
      background: #24b85f !important;
      color: white;
    }

    .note-btn.wrong {
      background: #d93b3b !important;
      color: white;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .result-box {
      background: #29292d;
      border-radius: 12px;
      padding: 11px 8px;
      text-align: center;
    }

    .result-value {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 800;
    }

    .best {
      text-align: center;
      font-weight: 700;
      margin-bottom: 15px;
    }

    @media (orientation: portrait) {
      .orientation-warning {
        display: block;
      }

      .main-content {
        display: none;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .app {
        padding-top: 4px;
        padding-bottom: 4px;
      }

      .fretboard {
        height: 245px;
      }

      .topbar {
        margin-bottom: 4px;
      }

      .stat {
        padding: 4px 3px;
        font-size: 13px;
      }

      .note-btn {
        min-height: 46px;
      }

      .fret-labels {
        height: 19px;
      }

      .fret-label {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="orientation-warning">
    🎸 Bitte das iPhone ins Querformat drehen.
  </div>

  <div class="main-content">

    <div id="setup" class="setup">

      <h1>🎸 Gitarren Noten Trainer</h1>

      <label for="questionCount">
        Anzahl der Noten
      </label>

      <select id="questionCount">
        <option value="10">10 Noten</option>
        <option value="20" selected>20 Noten</option>
        <option value="30">30 Noten</option>
        <option value="50">50 Noten</option>
        <option value="100">100 Noten</option>
      </select>

      <button id="startButton" class="primary">
        Training starten
      </button>

    </div>

    <div id="game" class="game">

      <div class="topbar">

        <div class="stat">
          Note
          <br>
          <span id="progress">1 / 20</span>
        </div>

        <div class="stat">
          Zeit
          <br>
          <span id="timer">00:00.0</span>
        </div>

        <div class="stat">
          Richtig
          <br>
          <span id="correctCount">0</span>
        </div>

        <div class="stat">
          Fehler
          <br>
          <span id="wrongCount">0</span>
        </div>

      </div>

      <div class="board-section">

        <div id="fretboard" class="fretboard">

          <div class="nut"></div>

          <div id="frets"></div>

          <div id="markers"></div>

          <div id="strings"></div>

          <div id="target" class="target"></div>

        </div>

        <div id="fretLabels" class="fret-labels"></div>

      </div>

      <div id="noteButtons" class="notes"></div>

    </div>

    <div id="result" class="result">

      <h2>Training beendet 🎸</h2>

      <div class="result-grid">

        <div class="result-box">
          Gesamtzeit
          <div
            id="resultTime"
            class="result-value"
          ></div>
        </div>

        <div class="result-box">
          Fehler
          <div
            id="resultErrors"
            class="result-value"
          ></div>
        </div>

        <div class="result-box">
          Noten
          <div
            id="resultCorrect"
            class="result-value"
          ></div>
        </div>

        <div class="result-box">
          Ø pro Note
          <div
            id="resultAverage"
            class="result-value"
          ></div>
        </div>

      </div>

      <div id="bestTime" class="best"></div>

      <button id="againButton" class="primary">
        Nochmal
      </button>

      <button id="menuButton" class="secondary">
        Anzahl ändern
      </button>

    </div>

  </div>

</div>

<script>

  const notes = [
    "C",
    "C#",
    "D",
    "D#",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "A#",
    "B"
  ];

  /*
    Standardstimmung:

    hohe E = E
    B      = B
    G      = G
    D      = D
    A      = A
    tiefe E = E
  */

  const openStrings = [
    4,
    11,
    7,
    2,
    9,
    4
  ];

  const setup =
    document.getElementById("setup");

  const game =
    document.getElementById("game");

  const result =
    document.getElementById("result");

  const frets =
    document.getElementById("frets");

  const strings =
    document.getElementById("strings");

  const markers =
    document.getElementById("markers");

  const fretLabels =
    document.getElementById("fretLabels");

  const target =
    document.getElementById("target");

  const noteButtons =
    document.getElementById("noteButtons");

  const progress =
    document.getElementById("progress");

  const timerDisplay =
    document.getElementById("timer");

  const correctDisplay =
    document.getElementById("correctCount");

  const wrongDisplay =
    document.getElementById("wrongCount");

  let totalQuestions = 20;

  let completedQuestions = 0;
  let errors = 0;

  let currentString = 0;
  let currentFret = 0;
  let correctNote = "";

  let previousString = -1;
  let previousFret = -1;

  let startTime = 0;
  let finalTime = 0;
  let timerInterval = null;

  let inputLocked = false;

  /*
    Bundpositionen werden nach echter
    Gitarrenmensur berechnet.

    Entfernung eines Bundes vom Sattel:

    x = 1 - 2^(-fret / 12)

    Danach skalieren wir Bund 22
    auf die gesamte Bildschirmbreite.
  */

  const fretPositions = [];

  function calculateFretPositions() {

    fretPositions.length = 0;

    const maxFret = 22;

    const rawMax =
      1 -
      Math.pow(
        2,
        -maxFret / 12
      );

    fretPositions.push(0);

    for (
      let fret = 1;
      fret <= maxFret;
      fret++
    ) {

      const raw =
        1 -
        Math.pow(
          2,
          -fret / 12
        );

      const scaled =
        raw / rawMax;

      fretPositions.push(
        scaled * 100
      );

    }

  }

  function getFretCenter(fret) {

    const left =
      fret === 1
        ? 0
        : fretPositions[
            fret - 1
          ];

    const right =
      fretPositions[fret];

    return (
      left + right
    ) / 2;

  }

  function getStringY(stringIndex) {

    return (
      9
      +
      stringIndex
      *
      16.4
    );

  }

  function buildFretboard() {

    frets.innerHTML = "";
    strings.innerHTML = "";
    markers.innerHTML = "";
    fretLabels.innerHTML = "";

    for (
      let fret = 1;
      fret <= 22;
      fret++
    ) {

      const line =
        document.createElement("div");

      line.className = "fret";

      line.style.left =
        fretPositions[fret]
        +
        "%";

      frets.appendChild(line);

      const label =
        document.createElement("div");

      label.className =
        "fret-label";

      label.textContent =
        fret;

      label.style.left =
        getFretCenter(fret)
        +
        "%";

      fretLabels.appendChild(
        label
      );

    }

    for (
      let string = 0;
      string < 6;
      string++
    ) {

      const line =
        document.createElement("div");

      line.className =
        "string s"
        +
        (string + 1);

      line.style.top =
        getStringY(string)
        +
        "%";

      strings.appendChild(line);

    }

    const singleMarkers = [
      3,
      5,
      7,
      9,
      15,
      17,
      19,
      21
    ];

    singleMarkers.forEach(
      fret => {

        createMarker(
          fret,
          50
        );

      }
    );

    createMarker(
      12,
      35
    );

    createMarker(
      12,
      65
    );

  }

  function createMarker(
    fret,
    y
  ) {

    const marker =
      document.createElement("div");

    marker.className =
      "marker";

    marker.style.left =
      getFretCenter(fret)
      +
      "%";

    marker.style.top =
      y + "%";

    markers.appendChild(
      marker
    );

  }

  function buildNoteButtons() {

    noteButtons.innerHTML = "";

    notes.forEach(
      note => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "note-btn";

        button.dataset.note =
          note;

        button.textContent =
          note;

        button.addEventListener(
          "click",
          () => answer(
            note,
            button
          )
        );

        noteButtons.appendChild(
          button
        );

      }
    );

  }

  function clearButtonFeedback() {

    document
      .querySelectorAll(
        ".note-btn"
      )
      .forEach(
        button => {

          button.classList.remove(
            "correct",
            "wrong"
          );

        }
      );

  }

  function startGame() {

    totalQuestions =
      Number(
        document
          .getElementById(
            "questionCount"
          )
          .value
      );

    completedQuestions = 0;
    errors = 0;

    previousString = -1;
    previousFret = -1;

    inputLocked = false;

    correctDisplay.textContent =
      "0";

    wrongDisplay.textContent =
      "0";

    clearButtonFeedback();

    setup.style.display =
      "none";

    result.style.display =
      "none";

    game.style.display =
      "block";

    startTime =
      performance.now();

    clearInterval(
      timerInterval
    );

    timerInterval =
      setInterval(
        updateTimer,
        50
      );

    nextQuestion();

  }

  function nextQuestion() {

    clearButtonFeedback();

    inputLocked = false;

    progress.textContent =
      (
        completedQuestions + 1
      )
      +
      " / "
      +
      totalQuestions;

    let newString;
    let newFret;

    do {

      newString =
        Math.floor(
          Math.random() * 6
        );

      newFret =
        Math.floor(
          Math.random() * 22
        )
        +
        1;

    }
    while (
      newString ===
        previousString
      &&
      newFret ===
        previousFret
    );

    currentString =
      newString;

    currentFret =
      newFret;

    previousString =
      newString;

    previousFret =
      newFret;

    const noteIndex =
      (
        openStrings[
          currentString
        ]
        +
        currentFret
      )
      %
      12;

    correctNote =
      notes[
        noteIndex
      ];

    positionTarget();

  }

  function positionTarget() {

    target.style.left =
      getFretCenter(
        currentFret
      )
      +
      "%";

    target.style.top =
      getStringY(
        currentString
      )
      +
      "%";

  }

  function answer(
    selectedNote,
    selectedButton
  ) {

    if (inputLocked) {
      return;
    }

    if (
      selectedNote ===
      correctNote
    ) {

      inputLocked = true;

      selectedButton
        .classList
        .add("correct");

      completedQuestions++;

      correctDisplay.textContent =
        completedQuestions;

      setTimeout(
        () => {

          if (
            completedQuestions
            >=
            totalQuestions
          ) {

            endGame();

          }
          else {

            nextQuestion();

          }

        },
        180
      );

    }
    else {

      inputLocked = true;

      errors++;

      wrongDisplay.textContent =
        errors;

      selectedButton
        .classList
        .add("wrong");

      const correctButton =
        document.querySelector(
          `.note-btn[data-note="${correctNote}"]`
        );

      if (correctButton) {

        correctButton
          .classList
          .add("correct");

      }

      setTimeout(
        () => {

          clearButtonFeedback();

          inputLocked = false;

        },
        400
      );

    }

  }

  function updateTimer() {

    const elapsed =
      performance.now()
      -
      startTime;

    timerDisplay.textContent =
      formatTime(
        elapsed
      );

  }

  function formatTime(
    milliseconds
  ) {

    const totalSeconds =
      milliseconds / 1000;

    const minutes =
      Math.floor(
        totalSeconds / 60
      );

    const seconds =
      Math.floor(
        totalSeconds % 60
      );

    const tenths =
      Math.floor(
        (
          totalSeconds % 1
        )
        *
        10
      );

    return (
      String(minutes)
        .padStart(2, "0")
      +
      ":"
      +
      String(seconds)
        .padStart(2, "0")
      +
      "."
      +
      tenths
    );

  }

  function endGame() {

    clearInterval(
      timerInterval
    );

    finalTime =
      performance.now()
      -
      startTime;

    game.style.display =
      "none";

    result.style.display =
      "block";

    const average =
      finalTime
      /
      totalQuestions
      /
      1000;

    document
      .getElementById(
        "resultTime"
      )
      .textContent =
        formatTime(
          finalTime
        );

    document
      .getElementById(
        "resultErrors"
      )
      .textContent =
        errors;

    document
      .getElementById(
        "resultCorrect"
      )
      .textContent =
        totalQuestions;

    document
      .getElementById(
        "resultAverage"
      )
      .textContent =
        average.toFixed(2)
        +
        " s";

    saveBestTime();

  }

  function saveBestTime() {

    const key =
      "guitarBest_"
      +
      totalQuestions;

    const oldBest =
      Number(
        localStorage.getItem(
          key
        )
      );

    const bestTimeElement =
      document.getElementById(
        "bestTime"
      );

    /*
      Für eine Bestzeit
      müssen 0 Fehler gemacht werden.
    */

    if (errors > 0) {

      if (oldBest) {

        bestTimeElement.textContent =
          "Bestzeit ohne Fehler: "
          +
          formatTime(
            oldBest
          );

      }
      else {

        bestTimeElement.textContent =
          "Bestzeiten zählen nur ohne Fehler.";

      }

      return;

    }

    if (
      !oldBest
      ||
      finalTime < oldBest
    ) {

      localStorage.setItem(
        key,
        finalTime
      );

      bestTimeElement.textContent =
        "🏆 Neue Bestzeit: "
        +
        formatTime(
          finalTime
        );

    }
    else {

      bestTimeElement.textContent =
        "Bestzeit: "
        +
        formatTime(
          oldBest
        );

    }

  }

  document
    .getElementById(
      "startButton"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .getElementById(
      "againButton"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .getElementById(
      "menuButton"
    )
    .addEventListener(
      "click",
      () => {

        result.style.display =
          "none";

        setup.style.display =
          "block";

      }
    );

  calculateFretPositions();
  buildFretboard();
  buildNoteButtons();

</script>

</body>
</html>
